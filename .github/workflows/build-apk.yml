name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/**

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Signed with the committed sideload keystore, so consecutive builds share
      # a signing identity and install over each other. See
      # android/app/build.gradle.kts for why that key is in the repo.
      #
      # --build-number drives versionCode. pubspec pins `1.0.0+1`, so without
      # this every APK claimed version 1 and Android had no reason to treat a
      # newer build as an upgrade. The run number is monotonic per repository.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # Runs after the Flutter build because that is what injects the Gradle
      # wrapper and local.properties into android/.
      #
      # These are the golden-fixture tests that pin the Kotlin detector to the
      # same expected counts as the Dart one. Kotlin counts steps live while
      # Dart replays sessions during calibration, so a drift between them would
      # make every before/after number describe the wrong algorithm.
      - name: Kotlin detector tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: stepcounter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
