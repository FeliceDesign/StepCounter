name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/flutter-android-step-counter-lmer7x

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Release build, signed with the debug key so the APK installs without
      # any keystore secrets in CI. See android/app/build.gradle.kts.
      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: stepcounter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
