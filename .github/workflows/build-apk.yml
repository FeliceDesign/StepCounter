name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/**

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Signed with the committed sideload keystore, so consecutive builds share
      # a signing identity and install over each other. See
      # android/app/build.gradle.kts for why that key is in the repo.
      #
      # --build-number drives versionCode. pubspec pins `1.0.0+1`, so without
      # this every APK claimed version 1 and Android had no reason to treat a
      # newer build as an upgrade. The run number is monotonic per repository.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # Prints the signing certificate so key stability is a logged fact rather
      # than something to take on trust.
      #
      # Android refuses an update signed by a different key, and the previous
      # arrangement — signing with the auto-generated debug key on an ephemeral
      # runner — produced a new key every build without ever saying so. Any two
      # builds whose fingerprints match here will install over each other; any
      # two that differ will not, and the log now says which.
      - name: Show APK signer
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk)
          DIGEST=$(echo "$CERTS" | grep -i 'SHA-256 digest' | head -1)
          echo "$DIGEST"
          # Also onto the run summary page, so checking it is one click rather
          # than a scroll through Gradle output.
          {
            echo "### APK signing key"
            echo ""
            echo '`'"$DIGEST"'`'
            echo ""
            echo "Builds sharing this fingerprint install over each other."
            echo "A build with a different one needs an uninstall first."
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs after the Flutter build because that is what injects the Gradle
      # wrapper and local.properties into android/.
      #
      # These are the golden-fixture tests that pin the Kotlin detector to the
      # same expected counts as the Dart one. Kotlin counts steps live while
      # Dart replays sessions during calibration, so a drift between them would
      # make every before/after number describe the wrong algorithm.
      - name: Kotlin detector tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: stepcounter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
